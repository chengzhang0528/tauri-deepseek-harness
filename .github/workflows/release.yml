name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    environment: oss-release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve tag version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag $env:GITHUB_REF_NAME must use vX.Y.Z"
          }
          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
          $metadata = Get-Content -Raw version.json | ConvertFrom-Json
          if ($metadata.launcherVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "version.json launcherVersion is invalid"
          }
          "MINIMUM_LAUNCHER_VERSION=$($metadata.launcherVersion)" >> $env:GITHUB_ENV

      - name: Install Rust GNU toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Build MSI
        run: npm run release:tag -- --tag "$env:GITHUB_REF_NAME"

      - name: Build verified runtime closure
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "dsh-runtime-$env:RELEASE_VERSION"
          $runtimeWork = Join-Path $env:RUNNER_TEMP "dsh-runtime-work-$env:RELEASE_VERSION"
          $runtimeOutput = Join-Path $env:RUNNER_TEMP "dsh-runtime-output-$env:RELEASE_VERSION"
          npm run prepare:runtime -- --runtime-root $runtimeRoot --work-dir $runtimeWork
          if ($LASTEXITCODE -ne 0) { throw "Runtime closure preparation failed" }
          node scripts/build-runtime.mjs --runtime-root $runtimeRoot --release $env:RELEASE_VERSION --minimum-launcher-version $env:MINIMUM_LAUNCHER_VERSION --output-dir $runtimeOutput
          if ($LASTEXITCODE -ne 0) { throw "Runtime closure verification and archive build failed" }
          "RUNTIME_OUTPUT=$runtimeOutput" >> $env:GITHUB_ENV

      - name: Publish verified runtime to OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: npm run publish:runtime -- --output-dir "$env:RUNTIME_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Desktop ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
