name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    environment: oss-release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve tag version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag $env:GITHUB_REF_NAME must use vX.Y.Z"
          }
          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
          $metadata = Get-Content -Raw version.json | ConvertFrom-Json
          if ($metadata.launcherVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "version.json launcherVersion is invalid"
          }
          "MINIMUM_LAUNCHER_VERSION=$($metadata.launcherVersion)" >> $env:GITHUB_ENV

      - name: Install Rust GNU toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Load existing immutable runtime catalog
        shell: pwsh
        run: |
          $catalogInput = Join-Path $env:RUNNER_TEMP "dsh-runtime-catalog-$env:RELEASE_VERSION.json"
          $bootstrapUrl = "https://shared-public-assets.oss-cn-beijing.aliyuncs.com/atlas-dsh-desktop/bootstrap/windows-x64.json"
          $bootstrapResponse = Invoke-WebRequest -Uri $bootstrapUrl -UseBasicParsing -SkipHttpErrorCheck
          if ($bootstrapResponse.StatusCode -eq 404) {
            @{
              schema = 1
              product = "atlas-dsh-desktop"
              platform = "windows"
              arch = "x64"
              releases = @()
            } | ConvertTo-Json -Depth 5 | Set-Content -Path $catalogInput -Encoding utf8
          } elseif ($bootstrapResponse.StatusCode -lt 200 -or $bootstrapResponse.StatusCode -ge 300) {
            throw "Existing OSS bootstrap could not be read: HTTP $($bootstrapResponse.StatusCode)"
          } else {
            $bootstrap = $bootstrapResponse.Content | ConvertFrom-Json
            if (-not $bootstrap.catalog) {
              @{
                schema = 1
                product = "atlas-dsh-desktop"
                platform = "windows"
                arch = "x64"
                releases = @()
              } | ConvertTo-Json -Depth 5 | Set-Content -Path $catalogInput -Encoding utf8
            } else {
              $catalogUrl = "https://shared-public-assets.oss-cn-beijing.aliyuncs.com/atlas-dsh-desktop/$($bootstrap.catalog.objectKey)"
              $catalogResponse = Invoke-WebRequest -Uri $catalogUrl -UseBasicParsing -SkipHttpErrorCheck
              if ($catalogResponse.StatusCode -lt 200 -or $catalogResponse.StatusCode -ge 300) {
                throw "Existing OSS catalog could not be read: HTTP $($catalogResponse.StatusCode)"
              }
              [IO.File]::WriteAllBytes($catalogInput, [Text.Encoding]::UTF8.GetBytes($catalogResponse.Content))
              $identity = Get-FileHash -Algorithm SHA256 -Path $catalogInput
              if ((Get-Item $catalogInput).Length -ne [int64]$bootstrap.catalog.bytes -or $identity.Hash.ToLowerInvariant() -ne $bootstrap.catalog.sha256.ToLowerInvariant()) {
                throw "Existing OSS catalog does not match Bootstrap digest"
              }
            }
          }
          "CATALOG_INPUT=$catalogInput" >> $env:GITHUB_ENV

      - name: Build MSI
        run: npm run release:tag -- --tag "$env:GITHUB_REF_NAME"

      - name: Build verified runtime closure
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "dsh-runtime-$env:RELEASE_VERSION"
          $runtimeWork = Join-Path $env:RUNNER_TEMP "dsh-runtime-work-$env:RELEASE_VERSION"
          $runtimeOutput = Join-Path $env:RUNNER_TEMP "dsh-runtime-output-$env:RELEASE_VERSION"
          npm run prepare:runtime -- --runtime-root $runtimeRoot --work-dir $runtimeWork
          if ($LASTEXITCODE -ne 0) { throw "Runtime closure preparation failed" }
          node scripts/build-runtime.mjs --runtime-root $runtimeRoot --release $env:RELEASE_VERSION --minimum-launcher-version $env:MINIMUM_LAUNCHER_VERSION --catalog-input $env:CATALOG_INPUT --output-dir $runtimeOutput
          if ($LASTEXITCODE -ne 0) { throw "Runtime closure verification and archive build failed" }
          "RUNTIME_OUTPUT=$runtimeOutput" >> $env:GITHUB_ENV

      - name: Publish verified runtime to OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: npm run publish:runtime -- --output-dir "$env:RUNTIME_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Desktop ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
