name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve tag version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag $env:GITHUB_REF_NAME must use vX.Y.Z"
          }
          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Install Rust GNU toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Build MSI
        run: npm run release:tag -- --tag "$env:GITHUB_REF_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Desktop ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
