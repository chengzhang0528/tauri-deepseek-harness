interface:
  display_name: "Solution Direction Review"
  short_description: "Check premises, preserve intent, and bound claims by evidence"
  default_prompt: "Use $align-solution-direction to align outcome, per-task execution type, control strength, persistence, boundary, invariants, ownership, and completion rules without inventing a global phase or follow-up task. Check user and agent premises independently, correct errors with evidence, and surface consequential omissions, costs, and reasoning bias."

policy:
  allow_implicit_invocation: true
