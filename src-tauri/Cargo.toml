[package]
name = "dsh-desktop"
version = "0.2.0"
description = "Native Windows host for DeepSeek Harness"
authors = ["DSH Desktop contributors"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "dsh_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0.145"

[dependencies]
anyhow = "1.0.100"
directories = "6.0.0"

reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "cookies"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.28"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"

url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
